<title>턴메이트 — 기능 정리 & 리디자인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e9ecef; font-family: Pretendard, -apple-system, sans-serif; color: #121a23; -webkit-font-smoothing: antialiased; }
  input, select, textarea, button { font-family: inherit; }
  .tm-press { transition: transform .12s ease, background .15s; }
  .tm-press:active { transform: scale(.975); }
  .tm-noscroll::-webkit-scrollbar { display: none; }
  .tm-noscroll { scrollbar-width: none; }
  .tm-dot { width: 6px; height: 6px; border-radius: 3px; background: currentColor; animation: tmblink 1.4s infinite; display: inline-block; }
  @keyframes tmblink { 50% { opacity: .22; } }
  .tm-pulse { animation: tmpulse 1.1s infinite; }
  @keyframes tmpulse { 0% { box-shadow: 0 0 0 0 oklch(0.53 0.15 248 / .5); } 100% { box-shadow: 0 0 0 24px oklch(0.53 0.15 248 / 0); } }
  .tm-pop { animation: tmpop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes tmpop { from { transform: scale(.4); opacity: 0; } }
  .tm-toast { animation: tmtoast .28s cubic-bezier(.2,.85,.25,1); }
  @keyframes tmtoast { from { transform: translateY(-16px); opacity: 0; } }
  .tm-fade { animation: tmfade .28s ease-out; }
  @keyframes tmfade { from { opacity: 0; transform: translateY(6px); } }

  .page { min-height: 100vh; display: grid; grid-template-columns: minmax(350px, 560px) auto; gap: 52px; justify-content: center; align-items: start; padding: 36px 40px 72px; }
  .notes { position: sticky; top: 36px; max-height: calc(100vh - 72px); overflow-y: auto; padding-right: 10px; }
  .notes h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.8px; margin: 0 0 8px; line-height: 1.24; }
  .notes .lead { font-size: 14.5px; color: #45505c; line-height: 1.62; margin: 0 0 20px; text-wrap: pretty; }
  .notetabs { display: flex; gap: 4px; padding: 4px; background: #fff; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.05); }
  .notetabs button { flex: 1; height: 36px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #818b96; cursor: pointer; }
  .notetabs button.on { background: #121a23; color: #fff; }
  .notes h2 { font-size: 12px; font-weight: 750; color: #818b96; letter-spacing: .5px; margin: 22px 0 9px; }
  .grp { border-top: 1px solid #d9dde2; padding: 13px 0 4px; }
  .grp:first-of-type { border-top: none; }
  .grp > b { display: block; font-size: 14.5px; font-weight: 780; letter-spacing: -0.2px; margin-bottom: 8px; }
  .feat { display: grid; grid-template-columns: 15px 1fr auto; gap: 8px; align-items: start; padding: 5px 0; font-size: 13px; line-height: 1.5; color: #45505c; }
  .feat .dot { width: 7px; height: 7px; border-radius: 4px; margin-top: 6px; }
  .feat .st { font-size: 10.5px; font-weight: 750; letter-spacing: .2px; padding: 2px 6px; border-radius: 5px; white-space: nowrap; margin-top: 1px; }
  .st.on { background: oklch(0.96 0.03 158); color: oklch(0.48 0.11 158); }
  .st.merge { background: oklch(0.96 0.028 248); color: oklch(0.44 0.12 250); }
  .st.cut { background: #eef0f2; color: #9aa4ae; text-decoration: line-through; }
  .fix { display: grid; grid-template-columns: 24px 1fr; gap: 0 9px; padding: 12px 0; border-top: 1px solid #d9dde2; }
  .fix .n { font-size: 12px; font-weight: 800; color: #818b96; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .fix b { display: block; font-size: 14.5px; font-weight: 760; margin-bottom: 3px; letter-spacing: -0.2px; }
  .fix p { margin: 0; font-size: 13px; line-height: 1.6; color: #45505c; text-wrap: pretty; }
  .fix .was { color: #a0522d; }
  .jump { display: inline-flex; margin-top: 6px; font-size: 12px; font-weight: 700; color: oklch(0.53 0.15 248); background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  .tokens { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 4px; }
  .tok { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #45505c; background: #fff; border-radius: 8px; padding: 6px 9px 6px 6px; font-weight: 600; }
  .tok i { width: 18px; height: 18px; border-radius: 5px; display: block; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 2px 0 12px; font-size: 11.5px; color: #6b7683; font-weight: 650; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  @media (max-width: 1020px) { .page { grid-template-columns: 1fr; justify-items: center; padding: 24px 18px 60px; } .notes { position: static; max-height: none; max-width: 600px; width: 100%; } }
</style>

<script type="text/babel">
const IN_TABS = [
  { id: 'home', label: '홈', icon: 'House' },
  { id: 'market', label: '대직', icon: 'ArrowLeftRight' },
  { id: 'schedule', label: '일정', icon: 'CalendarDays' },
  { id: 'me', label: '내 정보', icon: 'CircleUser' },
];
const AD_TABS = [
  { id: 'ad_home', label: '관제', icon: 'LayoutDashboard' },
  { id: 'ad_approvals', label: '승인', icon: 'ClipboardCheck' },
  { id: 'ad_schedule', label: '근무표', icon: 'CalendarRange' },
  { id: 'ad_salary', label: '급여', icon: 'Wallet' },
  { id: 'ad_settings', label: '설정', icon: 'Settings' },
];

function App() {
  const app = useTurnMate();
  const [role, setRole] = React.useState(() => localStorage.getItem('tm_role') || 'instructor');
  const [tab, setTab] = React.useState(() => localStorage.getItem('tm_tab') || 'home');
  const [adTab, setAdTab] = React.useState('ad_home');
  const [mkTab, setMkTab] = React.useState('find');
  const [detail, setDetail] = React.useState(null);
  const [assign, setAssign] = React.useState(null);
  const [salarySheet, setSalarySheet] = React.useState(false);
  const [instructorSheet, setInstructorSheet] = React.useState(null);
  const [confirmSheet, setConfirmSheet] = React.useState(false);
  const [adFilter, setAdFilter] = React.useState('urgent');
  const scrollRef = React.useRef(null);

  const notes = React.useRef(null);
  const [noteTab, setNoteTab] = React.useState('features');

  const setRoleBoth = (r) => { setRole(r); localStorage.setItem('tm_role', r); scrollRef.current && (scrollRef.current.scrollTop = 0); };
  const changeTab = (t) => { setTab(t); localStorage.setItem('tm_tab', t); scrollRef.current && (scrollRef.current.scrollTop = 0); };
  const go = (t, id, sub) => { changeTab(t); if (t === 'market') setMkTab(sub || 'find'); if (id) setTimeout(() => setDetail(id), 130); };
  const goAdmin = (t, a) => { setRoleBoth('admin'); setAdTab(t); if (a) setAdFilter(a); };

  React.useEffect(() => {
    window.__tm = {
      go, goAdmin, setRole: setRoleBoth, setDetail, setAssign, setConfirmSheet, setSalarySheet, setInstructorSheet,
      setNoteTab, setAdTab, setAdFilter, setMkTab, reset: app.resetAll, setMe: app.setMe,
      openOnboarding: app.resetOnboarding,
    };
  });

  const openReqs = app.state.requests.filter(r => r.status === 'recruiting' && r.by !== app.me).length;
  const urg = app.state.requests.filter(r => r.status === 'recruiting' && tm2Dday(r.date) <= 2 && tm2Dday(r.date) >= 0).length;
  const tabs = role === 'instructor' ? IN_TABS : AD_TABS;
  const active = role === 'instructor' ? tab : adTab;

  if (!app.state.onboarded) {
    return (
      <div className="page">
        <Notes noteTab={noteTab} setNoteTab={setNoteTab} role={role} setRole={setRoleBoth} app={app} />
        <div style={{ paddingTop: 4 }}>
          <IOSDevice width={402} height={874}>
            <div style={{ position: 'relative', height: '100%', background: '#fff' }}>
              <Onboarding app={app} onDone={() => { setRoleBoth('instructor'); changeTab('home'); }} />
            </div>
          </IOSDevice>
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      <Notes noteTab={noteTab} setNoteTab={setNoteTab} role={role} setRole={setRoleBoth} app={app} />
      <div style={{ paddingTop: 4 }}>
        <IOSDevice width={402} height={874}>
          <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column', background: T.bg,
            fontFamily: 'Pretendard, -apple-system, sans-serif', color: T.ink, overflow: 'hidden' }}>
            <div ref={scrollRef} className="tm-noscroll" style={{ flex: 1, overflowY: 'auto', paddingTop: 54 }}>
              <div key={role + active + app.me} className="tm-fade">
                {role === 'instructor' ? (
                  <>
                    {tab === 'home' && <IHome app={app} go={go} />}
                    {tab === 'market' && <IMarket app={app} onOpen={setDetail} tab={mkTab} setTab={setMkTab} />}
                    {tab === 'schedule' && <ISchedule app={app} />}
                    {tab === 'me' && <IMe app={app} openSalary={() => setSalarySheet(true)} openOnboarding={app.resetOnboarding} />}
                  </>
                ) : (
                  <>
                    {adTab === 'ad_home' && <ADash app={app} goApprovals={() => { setAdTab('ad_approvals'); setAdFilter('urgent'); }}
                      setApproval={setAssign} setTab={setAdTab} />}
                    {adTab === 'ad_approvals' && <AApprovals app={app} filter={adFilter} setFilter={setAdFilter} setApproval={setAssign} />}
                    {adTab === 'ad_schedule' && <ASchedule app={app} openInstructor={setInstructorSheet} openConfirm={() => setConfirmSheet(true)} />}
                    {adTab === 'ad_salary' && <ASalary app={app} />}
                    {adTab === 'ad_settings' && <ASettings app={app} />}
                  </>
                )}
              </div>
            </div>

            <nav style={{ display: 'grid', gridTemplateColumns: `repeat(${tabs.length},1fr)`, background: 'rgba(255,255,255,.97)',
              borderTop: `1px solid ${T.line}`, paddingBottom: 26, backdropFilter: 'blur(12px)', flexShrink: 0 }}>
              {tabs.map(t => {
                const on = active === t.id;
                const badge = t.id === 'market' ? openReqs : t.id === 'ad_approvals' ? urg : 0;
                return (
                  <button key={t.id} onClick={() => role === 'instructor' ? changeTab(t.id) : setAdTab(t.id)}
                    style={{ height: 58, border: 'none', background: 'none', fontFamily: 'inherit', cursor: 'pointer', display: 'flex',
                      flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4, color: on ? T.ink : T.ink3 }}>
                    <span style={{ position: 'relative' }}>
                      <Icon name={t.icon} size={23} stroke={on ? 2.3 : 1.8} />
                      {badge > 0 && <span style={{ position: 'absolute', top: -4, right: -9, minWidth: 18, height: 18, padding: '0 5px', borderRadius: 9,
                        background: T.red, color: '#fff', fontSize: 11, fontWeight: 800, display: 'flex', alignItems: 'center',
                        justifyContent: 'center', border: '2px solid #fff' }}>{badge}</span>}
                    </span>
                    <span style={{ fontSize: 11.5, fontWeight: on ? 750 : 600 }}>{t.label}</span>
                  </button>
                );
              })}
            </nav>

            <MarketDetail id={detail} onClose={() => setDetail(null)} app={app} />
            <AssignSheet id={assign} onClose={() => setAssign(null)} app={app} />
            <SalarySheet open={salarySheet} onClose={() => setSalarySheet(false)} app={app} />
            <InstructorSheet id={instructorSheet} onClose={() => setInstructorSheet(null)} app={app} />
            <ConfirmSheet open={confirmSheet} onClose={() => setConfirmSheet(false)} app={app} />

            {app.toast && (
              <div key={app.toast.key} className="tm-toast" style={{ position: 'absolute', top: 56, left: 14, right: 14, zIndex: 100, background: T.ink,
                color: '#fff', borderRadius: 14, padding: '13px 16px', fontSize: 14, fontWeight: 650, display: 'flex', alignItems: 'flex-start',
                gap: 9, boxShadow: '0 12px 32px rgba(0,0,0,.28)', lineHeight: 1.45 }}>
                <Icon name="Check" size={17} stroke={2.8} color="#fff" style={{ marginTop: 1 }} />{app.toast.msg}
              </div>
            )}
          </div>
        </IOSDevice>
      </div>
    </div>
  );
}
